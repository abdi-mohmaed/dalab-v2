buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "27.0.12077973"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("com.facebook.react:react-native-gradle-plugin:0.76.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

// Make these properties available to subprojects (like react-native-gesture-handler)
ext {
    buildToolsVersion = "34.0.0"
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 34
    ndkVersion = "27.0.12077973"
    kotlinVersion = "1.9.24"
    REACT_NATIVE_NODE_MODULES_DIR = "C:/Users/user/Dalab/node_modules/react-native"
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    configurations.all {
        resolutionStrategy {
            // Force 0.76.0 and the new artifact name for EVERYTHING in the workspace
            force "com.facebook.react:react-android:0.76.0"
            dependencySubstitution {
                substitute module("com.facebook.react:react-native") using module("com.facebook.react:react-android:0.76.0")
            }
        }
    }
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    project.configurations.all { config ->
        if (project.name != "app" && (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('kotlin-android'))) {
            if (config.name == "implementation" || config.name == "api") {
                project.dependencies.add(config.name, "com.facebook.react:react-android:0.76.0")
            }
        }
    }
}
